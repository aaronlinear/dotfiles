# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Mouse mode
set -g mouse on

# Prefix: C-a
set -g prefix C-a

# Vim-style pane navigation (prefix + h/j/k/l)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Renumber windows to close gaps (prefix + N)
bind-key N move-window -r \; display-message "Windows renumbered"

# Vi copy mode: v select, C-v rectangle, y yank
unbind-key -T copy-mode-vi v
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Init TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
